# PC exe(윈도우) + 안드로이드 APK 빌드 확인 (U8 / MOBILE.md M6).
# 결과물은 실행 화면의 Artifacts 에서 받는다: MiniFishing-windows (폴더 압축), MiniFishing-android (debug APK).
name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "릴리즈 버전 (예: 0.8.0) — 비우면 빌드만. 넣으면 태그 v<버전>과 GitHub 릴리즈를 만든다"
        required: false
        default: ""
  push:
    branches: ["claude/**", "main"]
    tags: ["v*"]          # v0.8.0 같은 태그를 올리면 두 빌드 뒤 GitHub 릴리즈까지 만든다
    paths-ignore: ["**.md"]

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"  # 한글 출력 (러너 콘솔 기본 cp1252)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: 사운드 점검 (구운 파일 최신 · 재생 지점 전부 연결, DESIGN.md 32-14)
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          python tools/bake_sfx.py --check
          python tools/bake_music.py --check
          python tools/bake_indoor.py --check
          python tools/sound_audit.py --strict
          python tools/tutorial_check.py
      - name: 아이콘
        run: python tools/make_icon.py build/icon.ico
      - name: PyInstaller (build.bat 과 같은 옵션)
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MiniFishing --icon "%CD%\build\icon.ico" --add-data "%CD%\data;data" --add-data "%CD%\assets;assets" --exclude-module tkinter --specpath build "%CD%\main.py"
          if errorlevel 1 exit /b 1
          copy /y dist_readme.txt dist\MiniFishing\README.txt
      - name: 실행 확인 (화면 없이 120프레임)
        timeout-minutes: 5
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./dist/MiniFishing/MiniFishing.exe --frames 120 --require-baked
          echo "exit $?"
      - uses: actions/upload-artifact@v4
        with:
          name: MiniFishing-windows
          path: dist/MiniFishing

  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 우분투 패키지 (buildozer 문서 기준)
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev automake lld libltdl-dev gettext build-essential
      - name: buildozer
        run: python -m pip install "buildozer==1.6.0" "cython<3.1" setuptools pygame-ce==2.5.8 numpy
      - name: 아이콘·스플래시
        run: python tools/make_android_assets.py
      - name: 사운드 점검 (APK에 묶일 구운 파일이 최신인지)
        run: |
          python tools/bake_sfx.py --check
          python tools/bake_music.py --check
          python tools/bake_indoor.py --check
      - name: 폰과 같은 pygame 2.6 에서 소리·장면 확인 (pygame-ce 전용 API 쓰면 여기서 실패)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m venv /tmp/pg26
          /tmp/pg26/bin/pip install -q pygame==2.6.1 numpy
          /tmp/pg26/bin/python tools/compat_smoke.py
      - name: SDK·NDK 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec', 'android/recipes/**/*.py') }}-v2
      - name: APK 빌드 (debug)
        run: yes | buildozer android debug
      - name: APK 안 pygame 모듈에 빠진 함수가 없는지 (폰에서 'cannot locate symbol' 로 꺼지는 것 방지)
        run: |
          set -e
          T=$(mktemp -d)
          unzip -q -o bin/*.apk 'lib/arm64-v8a/libpybundle.so' -d "$T"
          mkdir -p "$T/pb" && tar xzf "$T/lib/arm64-v8a/libpybundle.so" -C "$T/pb" --no-same-permissions
          chmod -R u+rwX "$T/pb"   # 묶음 안 폴더 권한이 막혀 있으면 find 가 아무것도 못 찾는다 (예전엔 '0개 검사'로 그냥 통과)
          bad=0
          for so in $(find "$T/pb" -path '*site-packages/pygame/*.so'); do
            und=$(readelf -Ws --dyn-syms "$so" | awk '$7=="UND"{print $8}' | grep -E '_(sse2|avx2|neon)|^alphablit_|^blit_blend_|^premul_surf|^pg_has_' || true)
            if [ -n "$und" ]; then echo "::error::$(basename $so) 에 정의 안 된 pygame 함수: $und"; bad=1; fi
          done
          # N5 공간별 소리(assets/sfx_space, 이름에 '~')가 APK 앱 묶음(private.tar)에 다 들어갔는지
          unzip -q -o bin/*.apk 'assets/private.tar' -d "$T"
          nsp=$(tar tf "$T/assets/private.tar" | grep -c 'sfx_space/.*~.*\.ogg$' || true)
          want=$(ls assets/sfx_space/*.ogg | wc -l)
          echo "APK 공간 소리 ${nsp}/${want}개"
          [ "$nsp" -eq "$want" ] || { echo "::error::APK 에 공간 소리가 빠짐 (${nsp}/${want})"; exit 1; }
          # 소리 구역 실내 버전 (assets/sfx_indoor, DESIGN.md 39)
          nin=$(tar tf "$T/assets/private.tar" | grep -c 'sfx_indoor/.*\.ogg$' || true)
          win=$(ls assets/sfx_indoor/*.ogg | wc -l)
          echo "APK 실내 소리 ${nin}/${win}개"
          [ "$nin" -eq "$win" ] || { echo "::error::APK 에 실내 소리가 빠짐 (${nin}/${win})"; exit 1; }
          # 오디오 최종 팩 (assets/sfx/reel·success·success_stems + audio_manifest.json) 이 다 들어갔는지
          nrr=$(tar tf "$T/assets/private.tar" | grep -c '\(^\|/\)sfx/\(reel\|success\|success_stems\)/[^/]*\.wav$\|\(^\|/\)sfx/audio_manifest\.json$' || true)
          wrr=$( ( find assets/sfx/reel assets/sfx/success assets/sfx/success_stems -name '*.wav'; ls assets/sfx/audio_manifest.json ) | wc -l)
          echo "APK 릴 소리 ${nrr}/${wrr}개"
          [ "$nrr" -eq "$wrr" ] || { echo "::error::APK 에 릴 소리가 빠짐 (${nrr}/${wrr})"; exit 1; }
          cnt=$(find "$T/pb" -path '*site-packages/pygame/*.so' | wc -l)
          echo "pygame 모듈 ${cnt}개 검사"
          [ "$cnt" -gt 10 ] || { echo "::error::APK 에서 pygame 모듈을 못 찾음 (${cnt}개)"; exit 1; }
          # 최적화 확인: -O0 이면 반투명 blit 함수가 거의 스택 ldr/str 뿐이라 폰에서 수십 배 느리다 (v0.8.11 파이팅 렉)
          # NDK 의 llvm-objdump 우선 (러너 기본 것은 AArch64 를 못 읽을 수 있음)
          OBJDUMP=$(find ~/.buildozer -path '*toolchains/llvm/prebuilt/*' -name 'llvm-objdump' 2>/dev/null | head -1)
          [ -n "$OBJDUMP" ] || OBJDUMP=$(command -v llvm-objdump || true)
          [ -n "$OBJDUMP" ] || { echo "::error::llvm-objdump 을 못 찾음"; exit 1; }
          probe=$("$OBJDUMP" -d --disassemble-symbols=alphablit_alpha_sse2_argb_surf_alpha "$(find "$T/pb" -path '*site-packages/pygame/surface*.so' | head -1)" 2>&1 | head -12)
          if ! echo "$probe" | grep -qE '^\s+[0-9a-f]+:'; then
            echo "::error::objdump($OBJDUMP) 출력이 비정상: $(echo "$probe" | tr '\n' ' ' | cut -c1-400)"; exit 1
          fi
          SURF=$(find "$T/pb" -path '*site-packages/pygame/surface*.so' | head -1)
          echo "objdump: $OBJDUMP / $SURF"
          readelf -Ws "$SURF" | grep -E 'alphablit_alpha' || true
          # 모듈 전체 명령 중 메모리 ldr/str 비율: -O0 빌드(v0.8.11) 49%, 최적화되면 30% 안팎
          share=$("$OBJDUMP" -d "$SURF" | awk 'NF>2{n++; if($3~/^(ldr|str|ldur|stur)$/) m++} END{print (n ? int(100*m/n) : 100)}')
          fn=$("$OBJDUMP" -d --disassemble-symbols=alphablit_alpha_sse2_argb_surf_alpha "$SURF" 2>&1 | \
               awk 'NF>2{n++; if($3~/^(ldr|str|ldur|stur)$/) m++} END{print n+0, (n ? int(100*m/n) : -1)}' || true)
          echo "surface 모듈 ldr/str ${share}% · alphablit_alpha_sse2_argb_surf_alpha (명령 수, %): ${fn}  (-O0 이던 v0.8.11: 49% · 3400, 86%)"
          if [ "$share" -gt 40 ]; then echo "::error::pygame 이 최적화 없이(-O0) 컴파일된 것 같음 (surface ldr/str ${share}%, 함수 ${fn})"; bad=1; fi
          exit $bad
      - name: APK 화면 방향이 가로인지 (매니페스트 screenOrientation 0 = landscape, 6 = sensorLandscape)
        run: |
          AAPT=$(find ~/.buildozer -path '*build-tools*' -name aapt -type f | sort | tail -1)
          line=$("$AAPT" dump xmltree bin/*.apk --file AndroidManifest.xml 2>/dev/null | grep -m1 screenOrientation || \
                 "$AAPT" dump xmltree bin/*.apk AndroidManifest.xml | grep -m1 screenOrientation)
          echo "$line"
          echo "$line" | grep -Eq '\)0x(0|6)$' || { echo "::error::가로가 아님: $line"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: MiniFishing-android
          path: bin/*.apk

  release:
    # 태그(v*) 푸시 또는 수동 실행에 release 버전을 넣었을 때: 두 빌드 결과를 릴리즈에 올림 (exe 폴더 zip + APK)
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: 파일 이름 정리
        run: |
          V="${{ inputs.release != '' && format('v{0}', inputs.release) || github.ref_name }}"
          echo "TAG=$V" >> "$GITHUB_ENV"
          mkdir -p out
          (cd art/MiniFishing-windows && zip -qr "../../out/MiniFishing-${V}-windows.zip" .)
          cp art/MiniFishing-android/*.apk "out/MiniFishing-${V}-android.apk"
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 미니 피싱 (Mini Fishing) ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          files: out/*
