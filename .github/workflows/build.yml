# PC exe(윈도우) + 안드로이드 APK 빌드 확인 (U8 / MOBILE.md M6).
# 결과물은 실행 화면의 Artifacts 에서 받는다: FishingGame-windows (폴더 압축), FishingGame-android (debug APK).
name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "릴리즈 버전 (예: 0.8.0) — 비우면 빌드만. 넣으면 태그 v<버전>과 GitHub 릴리즈를 만든다"
        required: false
        default: ""
  push:
    branches: ["claude/**", "main"]
    tags: ["v*"]          # v0.8.0 같은 태그를 올리면 두 빌드 뒤 GitHub 릴리즈까지 만든다
    paths-ignore: ["**.md"]

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"  # 한글 출력 (러너 콘솔 기본 cp1252)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: 사운드 점검 (구운 파일 최신 · 재생 지점 전부 연결, DESIGN.md 32-14)
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          python tools/bake_sfx.py --check
          python tools/bake_music.py --check
          python tools/sound_audit.py --strict
      - name: 아이콘
        run: python tools/make_icon.py build/icon.ico
      - name: PyInstaller (build.bat 과 같은 옵션)
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FishingGame --icon "%CD%\build\icon.ico" --add-data "%CD%\data;data" --add-data "%CD%\assets;assets" --exclude-module tkinter --specpath build "%CD%\main.py"
          if errorlevel 1 exit /b 1
          copy /y dist_readme.txt dist\FishingGame\README.txt
      - name: 실행 확인 (화면 없이 120프레임)
        timeout-minutes: 5
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./dist/FishingGame/FishingGame.exe --frames 120 --require-baked
          echo "exit $?"
      - uses: actions/upload-artifact@v4
        with:
          name: FishingGame-windows
          path: dist/FishingGame

  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 우분투 패키지 (buildozer 문서 기준)
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev automake lld libltdl-dev gettext build-essential
      - name: buildozer
        run: python -m pip install "buildozer==1.6.0" "cython<3.1" setuptools pygame-ce==2.5.8 numpy
      - name: 아이콘·스플래시
        run: python tools/make_android_assets.py
      - name: 사운드 점검 (APK에 묶일 구운 파일이 최신인지)
        run: |
          python tools/bake_sfx.py --check
          python tools/bake_music.py --check
      - name: 폰과 같은 pygame 2.6 에서 소리·장면 확인 (pygame-ce 전용 API 쓰면 여기서 실패)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m venv /tmp/pg26
          /tmp/pg26/bin/pip install -q pygame==2.6.1 numpy
          /tmp/pg26/bin/python tools/compat_smoke.py
      - name: SDK·NDK 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec', 'android/recipes/**/*.py') }}-v2
      - name: APK 빌드 (debug)
        run: yes | buildozer android debug
      - name: APK 안 pygame 모듈에 빠진 함수가 없는지 (폰에서 'cannot locate symbol' 로 꺼지는 것 방지)
        run: |
          set -e
          T=$(mktemp -d)
          unzip -q -o bin/*.apk 'lib/arm64-v8a/libpybundle.so' -d "$T"
          mkdir -p "$T/pb" && tar xzf "$T/lib/arm64-v8a/libpybundle.so" -C "$T/pb"
          bad=0
          for so in $(find "$T/pb" -path '*site-packages/pygame/*.so'); do
            und=$(readelf -Ws --dyn-syms "$so" | awk '$7=="UND"{print $8}' | grep -E '_(sse2|avx2|neon)|^alphablit_|^blit_blend_|^premul_surf|^pg_has_' || true)
            if [ -n "$und" ]; then echo "::error::$(basename $so) 에 정의 안 된 pygame 함수: $und"; bad=1; fi
          done
          echo "pygame 모듈 $(find "$T/pb" -path '*site-packages/pygame/*.so' | wc -l)개 검사"
          exit $bad
      - name: APK 화면 방향이 가로인지 (매니페스트 screenOrientation 0 = landscape, 6 = sensorLandscape)
        run: |
          AAPT=$(find ~/.buildozer -path '*build-tools*' -name aapt -type f | sort | tail -1)
          line=$("$AAPT" dump xmltree bin/*.apk --file AndroidManifest.xml 2>/dev/null | grep -m1 screenOrientation || \
                 "$AAPT" dump xmltree bin/*.apk AndroidManifest.xml | grep -m1 screenOrientation)
          echo "$line"
          echo "$line" | grep -Eq '\)0x(0|6)$' || { echo "::error::가로가 아님: $line"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: FishingGame-android
          path: bin/*.apk

  release:
    # 태그(v*) 푸시 또는 수동 실행에 release 버전을 넣었을 때: 두 빌드 결과를 릴리즈에 올림 (exe 폴더 zip + APK)
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: 파일 이름 정리
        run: |
          V="${{ inputs.release != '' && format('v{0}', inputs.release) || github.ref_name }}"
          echo "TAG=$V" >> "$GITHUB_ENV"
          mkdir -p out
          (cd art/FishingGame-windows && zip -qr "../../out/FishingGame-${V}-windows.zip" .)
          cp art/FishingGame-android/*.apk "out/FishingGame-${V}-android.apk"
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 낚시 게임 ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          files: out/*
